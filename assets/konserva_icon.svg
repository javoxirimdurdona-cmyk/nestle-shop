<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="canBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E24C56"/>
      <stop offset="55%" stop-color="#C81D2A"/>
      <stop offset="100%" stop-color="#8F1420"/>
    </linearGradient>
    <linearGradient id="canLidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
